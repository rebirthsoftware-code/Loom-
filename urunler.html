<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mağaza — LOOMÉ</title>
  <meta name="description" content="LOOMÉ mağazası: el işçiliğiyle üretilen dekoratif objeler. Yüzen Kupa ve yakında gelecek yeni parçalar.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="urunler">

  <main id="icerik">

    <section class="page-head">
      <div class="container">
        <nav class="breadcrumb" aria-label="Sayfa yolu">
          <a href="index.html">Ana Sayfa</a><span>Mağaza</span>
        </nav>
        <h1 id="shopHeading">Mağaza</h1>
        <p id="shopTagline">Şimdilik tek bir yıldızımız var — yakında yeni parçalar geliyor.</p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="shop-toolbar">
          <div class="filter-pills" id="filterPills"></div>
          <div class="shop-meta">
            <span class="result-count" id="resultCount"></span>
            <div class="sort-select">
              <label for="sortSelect">Sırala</label>
              <select id="sortSelect">
                <option value="featured">Öne çıkanlar</option>
                <option value="price-asc">Fiyat (artan)</option>
                <option value="price-desc">Fiyat (azalan)</option>
                <option value="rating">En beğenilenler</option>
              </select>
            </div>
          </div>
        </div>

        <div class="product-grid" id="shopGrid"></div>

        <div class="shop-empty" id="shopEmpty" hidden>
          <h3>Aradığınızı bulamadık</h3>
          <p>Farklı bir kategori veya arama terimi deneyebilirsiniz.</p>
        </div>
      </div>
    </section>

  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
